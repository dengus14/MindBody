version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: mindbody-postgres
    environment:
      POSTGRES_DB: mindbodydb
      POSTGRES_USER: minduser
      POSTGRES_PASSWORD: mindpass
    ports:
      - "5433:5432"
    volumes:
      - mindbody-data:/var/lib/postgresql/data
    restart: always

volumes:
  mindbody-data:
